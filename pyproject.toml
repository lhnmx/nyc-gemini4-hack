[project]
name = "nyc-gemini4-hack"
version = "0.1.0"
description = "CraftPOV — narrated, illustrated build guides grounded in hands-on tutorials"
readme = "README.md"
authors = [
    { name = "Minh Le", email = "lehnminh@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.165.0",
    "google-genai>=3.6.1",
    "httpx>=0.28.0",
    "imageio-ffmpeg>=0.8.1",
    "mcp>=1.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32.0",
    "vercel-blob==0.6.1",
]

[project.scripts]
nyc-gemini4-hack = "nyc_gemini4_hack:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.fastapi.static]
exclude = true
